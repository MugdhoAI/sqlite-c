<g transform="translate(76 0)">
<text x="0" y="128" fill="#e9c46a" font-family="ui-monospace, Consolas, monospace" font-size="16" letter-spacing="4.5">A SQLITE INSPIRED DATABASE ENGINE</text>
<text x="-4" y="238" fill="#fbf7ee" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="800" letter-spacing="-4">sqlite<tspan fill="url(#titleBlue)">-c</tspan></text>
<text x="0" y="298" fill="#f8f3e6" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="700">Small. Simple. <tspan fill="#2dd4bf">Powerful.</tspan></text>
<text x="0" y="344" fill="#ddd3e6" font-family="Arial, Helvetica, sans-serif" font-size="20.5">A compact relational database engine in C11.</text>
<text x="0" y="374" fill="#ddd3e6" font-family="Arial, Helvetica, sans-serif" font-size="20.5">Pages, B-tree storage and a SQL parser, small</text>
<text x="0" y="402" fill="#ddd3e6" font-family="Arial, Helvetica, sans-serif" font-size="20.5">enough to study end to end.</text>
<g font-family="ui-monospace, Consolas, monospace" font-size="13.5" letter-spacing="2.2" fill="#9a8ab0">
<text x="0" y="452">C11  ·  B-TREE  ·  PAGER  ·  SQL PARSER  ·  TESTS</text>
</g></g>
