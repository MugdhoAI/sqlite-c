<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
<title id="title">sqlite-c: Small. Simple. Powerful.</title>
<desc id="desc">A blueprint style banner for sqlite-c, a compact relational database engine in C11, showing a B-tree lookup for id 5 across 4096 byte pages.</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#170a1e"/><stop offset=".5" stop-color="#0e0514"/><stop offset="1" stop-color="#050208"/>
  </linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity=".14"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="titleBlue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f7e08b"/><stop offset=".42" stop-color="#d9ab3c"/><stop offset=".54" stop-color="#ffedb5"/><stop offset="1" stop-color="#c99635"/>
  </linearGradient>
  <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2e1a3d"/><stop offset=".45" stop-color="#20102e"/><stop offset="1" stop-color="#150a1f"/>
  </linearGradient>
  <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#41255a"/><stop offset="1" stop-color="#2c1742"/>
  </linearGradient>
  <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#14b8a6"/>
  </linearGradient>
  <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#221331"/><stop offset="1" stop-color="#120a1b"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="glowAmber" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M50 0H0V50" fill="none" stroke="#2a5b8f" stroke-width="1"/>
  </pattern>
  <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d4a437" stop-opacity="0"/><stop offset=".5" stop-color="#d4a437" stop-opacity=".8"/><stop offset="1" stop-color="#d4a437" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sheenGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset=".55" stop-color="#ffffff" stop-opacity=".02"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="vig" cx=".5" cy=".46" r=".78">
    <stop offset=".58" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".42"/>
  </radialGradient>
  <radialGradient id="gemGlow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity=".34"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
  </radialGradient>
</defs>
