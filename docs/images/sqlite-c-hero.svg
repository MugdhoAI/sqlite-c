<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">sqlite-c — a SQLite-inspired database engine in C</title>
<desc id="desc">A dark technical banner showing sqlite-c, its C database engine focus, and a stylized B-tree and page storage diagram.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070d16"/><stop offset="1" stop-color="#0a1728"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#20334b" stroke-width="1" opacity=".5"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
