<g id="lookup-anim">
  <!-- chip ignite: border flare -->
  <rect x="845" y="46" width="540" height="46" rx="9" fill="none" stroke="#5eead4" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0;0" keyTimes="0;0.03;0.16;0.22;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <!-- chip dot pulse ring -->
  <g transform="translate(872 69)">
    <circle r="9" fill="none" stroke="#5eead4" stroke-width="2" opacity="0">
      <animateTransform attributeName="transform" type="scale" additive="sum" values="0.4;0.4;1.2;1.9;1.9" keyTimes="0;0.01;0.05;0.09;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0;0" keyTimes="0;0.02;0.05;0.09;1" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- light drop: chip to root -->
  <g transform="translate(872 69)">
    <circle r="4.5" fill="#5eead4" filter="url(#glowAmber)" opacity="0">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;243 35;243 35" keyTimes="0;0.06;0.13;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.07;0.12;0.14;1" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- root scan: key 2 checked and passed -->
  <rect x="938" y="164" width="144" height="38" rx="6" fill="#2dd4bf" opacity="0">
    <animate attributeName="opacity" values="0;0;0.28;0;0" keyTimes="0;0.15;0.18;0.23;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <!-- root gem flare -->
  <rect x="1092" y="164" width="144" height="38" rx="6" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0.21;0.24;0.30;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(1164 183)">
    <circle r="12" fill="none" stroke="#5eead4" stroke-width="2" opacity="0">
      <animateTransform attributeName="transform" type="scale" additive="sum" values="0.5;0.5;1.1;1.7;1.7" keyTimes="0;0.21;0.26;0.33;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.21;0.25;0.33;1" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- descent: root gem to leaf gem along the teal connector -->
  <g transform="translate(1164 183)">
    <circle r="4.5" fill="#5eead4" filter="url(#glowAmber)" opacity="0">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;21 47;80 95;116 132;60 204;60 204" keyTimes="0;0.27;0.295;0.315;0.33;0.355;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.265;0.28;0.345;0.36;1" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- leaf gem flare + ring + glow swell -->
  <ellipse cx="1282" cy="438" rx="215" ry="46" fill="url(#gemGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.36;0.46;0.78;0.92;1" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="1200" y="368" width="48" height="38" rx="6" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.36;0.39;0.47;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(1224 387)">
    <circle r="10" fill="none" stroke="#5eead4" stroke-width="2" opacity="0">
