  <text x="60" y="170" fill="#f8fafc" font-size="91" font-weight="800" letter-spacing="-4">sqlite<tspan fill="url(#blue)">-c</tspan></text>
  <text x="65" y="222" fill="#e2e8f0" font-size="31" font-weight="650">Understand what happens beneath SQL.</text>
  <text x="66" y="264" fill="#a9bdd3" font-size="19">A compact relational database engine written in C11.</text>
  <text x="66" y="292" fill="#a9bdd3" font-size="19">Pages, B-trees, parsing, persistence, and tests.</text>
